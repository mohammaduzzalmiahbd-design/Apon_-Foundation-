    <style>
      body {
        font-family: 'Inter', 'Noto Sans Bengali', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      /* STRICT A4 PAPER STYLES */
      .a4-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
        background-color: #e2e8f0;
        padding: 2rem;
        overflow: visible;
      }

      .a4-paper {
        background-color: white;
        width: 794px;
        min-height: 1123px;
        height: auto;
        padding: 96px;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        color: black;
        flex-shrink: 0;
        position: relative;
        box-sizing: border-box;
        overflow: hidden;
        margin-bottom: 2rem;
      }

      @media screen and (max-width: 850px) {
        .a4-wrapper {
            padding: 10px;
            display: block;
            overflow-x: auto; 
            background-color: #f1f5f9;
        }
        .a4-paper {
           margin: 0 auto 20px auto;
           min-width: 794px; 
        }
      }

      @media print {
        @page { size: A4 portrait; margin: 0; }
        body { margin: 0; padding: 0; background: white; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .no-print { display: none !important; }
        .a4-wrapper { padding: 0; background: white; display: block; width: 100%; margin: 0; }
        .a4-paper { width: 210mm; height: auto; min-height: 297mm; padding: 25.4mm !important; margin: 0 !important; box-shadow: none; page-break-after: always; overflow: visible; }
      }
    </style>
